                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Limite de débit atteinte. En-tête `Retry-After` en secondes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Panne injectée.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: Panne injectée, transitoire.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
