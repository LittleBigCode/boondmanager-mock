# CI: tests + lint on every push/PR, then build & push the container image to
# GitHub Container Registry (ghcr.io) on main and on version tags.
#
# Published image: ghcr.io/littlebigcode/boondmanager-mock
#   :latest   — every push to main
#   :X.Y.Z    — on tags `vX.Y.Z`
#   :sha-…    — every pushed build (traceability)
#
# Auth is the built-in GITHUB_TOKEN (permissions.packages: write) — no secret
# to provision. The image is smoke-tested (container boots, /health answers,
# /api authenticates) BEFORE being pushed.

name: CI

on:
  push:
    branches: ["main"]
    tags: ["v*.*.*"]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the environment
        run: uv sync --frozen

      - name: Ruff (lint + format)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src/boondmanager_mock

      - name: Pytest (dialect, evolution, failure modes, committed contract)
        run: uv run pytest tests/

  image:
    name: Build & push image (GHCR)
    needs: tests
    # PRs only run the tests; the image is published from main and tags.
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags & OCI labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Build (local, for the smoke test)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: boondmanager-mock:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — the image must boot and speak the dialect
        run: |
          docker run -d --rm --name smoke -p 8000:8000 boondmanager-mock:smoke
          for i in $(seq 1 30); do
            curl -sf http://localhost:8000/health > /dev/null && break
            sleep 1
          done
          curl -sf http://localhost:8000/health
          # Unauthenticated /api must answer the Boond 401 envelope.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8000/api/resources)" = "401"
          docker stop smoke

      - name: Push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
